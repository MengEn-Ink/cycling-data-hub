<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的骑行数据 · 四套移动端方向</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #050505;
        color: #f2f0ea;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
      }
      header {
        position: sticky;
        z-index: 10;
        top: 0;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 22px;
        background: #050505e8;
        border-bottom: 1px solid #333;
        backdrop-filter: blur(14px);
      }
      h1 {
        margin: 0;
        font-size: 17px;
      }
      header p {
        margin: 0;
        color: #999;
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 375px);
        gap: 22px;
        width: max-content;
        padding: 24px;
      }
      .direction {
        width: 375px;
      }
      .meta {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .meta b {
        font-size: 13px;
      }
      .meta a {
        min-height: 44px;
        display: flex;
        align-items: center;
        color: #aaa;
        text-decoration: none;
        font-size: 12px;
      }
      .phone {
        width: 375px;
        height: 812px;
        overflow: hidden;
        border: 1px solid #454545;
        border-radius: 28px;
        background: #111;
        box-shadow: 0 20px 50px #000;
      }
      .phone iframe {
        display: block;
        width: 375px;
        height: 812px;
        border: 0;
        background: #111;
      }
      @media (max-width: 800px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .grid {
          display: block;
          width: auto;
          padding: 18px;
        }
        .direction {
          width: 100%;
          max-width: 375px;
          margin: 0 auto 38px;
        }
        .phone {
          width: 100%;
          border-radius: 22px;
        }
        .phone iframe {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>我的骑行数据 · 四套移动端方向</h1>
      <p>基准视口 375×812 · iframe 内可独立滚动</p>
    </header>
    <main class="grid">
      <section class="direction">
        <div class="meta">
          <b>01 · Night Peloton V2</b
          ><a href="mobile-01-night-peloton-v2.html">单独打开</a>
        </div>
        <div class="phone">
          <iframe
            src="mobile-01-night-peloton-v2.html"
            title="方向01 夜间集团优化版"
          ></iframe>
        </div>
      </section>
      <section class="direction">
        <div class="meta">
          <b>02 · Route Constellation</b
          ><a href="mobile-02-route-constellation.html">单独打开</a>
        </div>
        <div class="phone">
          <iframe
            src="mobile-02-route-constellation.html"
            title="方向02 路线星座"
          ></iframe>
        </div>
      </section>
      <section class="direction">
        <div class="meta">
          <b>05 · Distance Manifesto V3</b
          ><a href="mobile-05-distance-manifesto-v3.html">单独打开</a>
        </div>
        <div class="phone">
          <iframe
            src="mobile-05-distance-manifesto-v3.html"
            title="方向05 里程宣言数据工作台版"
          ></iframe>
        </div>
      </section>
      <section class="direction">
        <div class="meta">
          <b>06 · Dark Ride Ledger</b
          ><a href="mobile-06-dark-ride-ledger.html">单独打开</a>
        </div>
        <div class="phone">
          <iframe
            src="mobile-06-dark-ride-ledger.html"
            title="方向06 暗色骑行簿"
          ></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
