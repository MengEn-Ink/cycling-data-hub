name: Nightly photobook refresh

on:
  schedule:
    # GitHub cron uses UTC: 13:00 UTC = 21:00 Asia/Shanghai.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-photobook-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      SECRETS_ADMIN_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        run: |
          test -n "$STRAVA_CLIENT_ID"
          test -n "$STRAVA_CLIENT_SECRET"
          test -n "$STRAVA_REFRESH_TOKEN"
          test -n "$SECRETS_ADMIN_TOKEN"

      - name: Select current book year
        run: |
          book_year="$(TZ=Asia/Shanghai date +%Y)"
          echo "BOOK_YEAR=$book_year" >> "$GITHUB_ENV"

      - name: Restore public photo baseline
        run: |
          previous_root="$(mktemp -d)"
          previous_dir="$previous_root/site"
          previous_book="$previous_dir"
          previous_photos="$previous_dir/assets/photos"
          mkdir -p data/photo-cache
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$previous_dir" origin/gh-pages
            if test -d "$previous_dir/photobook"; then
              previous_book="$previous_dir/photobook"
              previous_photos="$previous_dir/photobook/assets/photos"
            fi
            if test -d "$previous_photos"; then
              find "$previous_photos" -type f -name '*.jpg' ! -name 'athlete.jpg' -exec cp {} data/photo-cache/ \;
            fi
          fi
          echo "PREVIOUS_BOOK=$previous_book" >> "$GITHUB_ENV"

      - name: Fetch current Strava activities
        id: fetch
        continue-on-error: true
        run: |
          echo "FETCH_OK=false" >> "$GITHUB_ENV"
          python -m strava_photobook fetch --year "$BOOK_YEAR"
          echo "FETCH_OK=true" >> "$GITHUB_ENV"

      - name: Persist rotated Strava refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          if test -f data/.strava_token.json; then
            python -c 'import json; print(json.load(open("data/.strava_token.json"))["refresh_token"])' \
              | gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          fi

      - name: Retry Strava fetch after rate limit
        if: steps.fetch.outcome == 'failure'
        continue-on-error: true
        run: |
          # Strava resets its short-term quota on fixed 15-minute UTC boundaries.
          wait_seconds=$((900 - $(date +%s) % 900 + 60))
          echo "Waiting ${wait_seconds}s for the next Strava quota window"
          sleep "$wait_seconds"
          python -m strava_photobook fetch --year "$BOOK_YEAR"
          echo "FETCH_OK=true" >> "$GITHUB_ENV"

      - name: Persist refresh token after retry
        if: steps.fetch.outcome == 'failure' && env.FETCH_OK == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          python -c 'import json; print(json.load(open("data/.strava_token.json"))["refresh_token"])' \
            | gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"

      - name: Sync optional Intervals.icu training data
        if: env.FETCH_OK == 'true' && env.INTERVALS_API_KEY != ''
        continue-on-error: true
        run: python -m strava_photobook sync-intervals --year "$BOOK_YEAR"

      - name: Build current-year photobook
        if: env.FETCH_OK == 'true'
        run: |
          python -m strava_photobook build "$BOOK_YEAR"
          node --test "books/$BOOK_YEAR/html-contract.test.mjs"
          python -m strava_photobook build-dashboard "$BOOK_YEAR"

      - name: Test and validate before publishing
        if: env.FETCH_OK == 'true'
        run: |
          python -m unittest discover -v
          node --test runtime/*.test.mjs
          node --test runtime/dashboard/*.test.mjs
          python -m tools.layout_gate
          python tools/photo_layout_gate.py "books/$BOOK_YEAR/photobook/index.html"
          python tools/validate_release.py "books/$BOOK_YEAR/photobook" --baseline "$PREVIOUS_BOOK" --require-heatmap
          python tools/validate_dashboard.py "books/$BOOK_YEAR"

      - name: Publish gh-pages atomically
        if: env.FETCH_OK == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_root="$(mktemp -d)"
          publish_dir="$publish_root/site"
          git worktree add --detach "$publish_dir" origin/gh-pages
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "books/$BOOK_YEAR/." "$publish_dir/"
          cd "$publish_dir"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git add --all
          if git diff --cached --quiet; then
            echo "No public changes"
          else
            git commit -m "Publish nightly Strava photobook"
            git push origin HEAD:refs/heads/gh-pages
          fi
